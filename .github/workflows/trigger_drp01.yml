name: Trigger DRP01

on:
  schedule:
    - cron: "45 20 * * *"   # JST 05:45（UTC 20:45）
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger DRP01 workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: fetch_weather.yml
          ref: main
