name: Fetch Weather Data v3.0
#v2.0: JSTからUTCに変更
#v3.0: 二段構え構成(trigger_drp01.yml設定)に伴いschedule行 を削除
permissions:
  contents: write

on:
  workflow_dispatch:        # 手動実行 & トリガーからの呼び出し専用

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run weather script
        run: python scripts/fetch_weather.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/weather.csv
          git commit -m "Update weather data" || echo "No changes to commit"
          git push || echo "Nothing to push"



